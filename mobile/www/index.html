<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2f2f7">
  <title>ORBIT</title>
  <link rel="icon" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@420;520;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <script>
    (function () {
      var dark = localStorage.getItem('orbit.theme') === 'dark';
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    })();
  </script>
</head>
<body>
  <div class="app">
    <header id="topbar" class="topbar" hidden></header>
    <div id="offline-banner" class="offline-banner" hidden></div>
    <main id="view" class="view"></main>
    <nav id="tabbar" class="tabbar" hidden></nav>
  </div>
  <div id="toast" class="toast" role="status" hidden></div>
  <div id="modal-root"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
